name: HPO controller restart diagnostic (fork only)

on:
  push:
    branches:
      - diagnostic/hpo-recovery-20261113-r01

permissions:
  contents: read

jobs:
  hpo-restart-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile and run targeted diagnostic
        run: |
          go test ./pkg/controller -run '^TestDiagnostic(RestartAfterAmbiguousCreate|PermanentTrialAdmissionRejection)
 -count=1 -v
